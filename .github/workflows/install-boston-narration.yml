name: Install Boston narration

on:
  push:
    branches:
      - boston-voice-28

permissions:
  contents: write

jobs:
  install-narration:
    if: ${{ !contains(github.event.head_commit.message, '[voice-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download final narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/voice/boston
          curl --fail --location --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/1ea1c97f-e9b4-4d0b-ad3d-44594b3f591f/Boston_Final_Niki_p01.mp3' --output 'public/voice/boston/p01.mp3'
